name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows-powershell:
    name: Lint + Test (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint + Test + Package
        shell: powershell
        run: ./build.ps1 -Bootstrap -Task All

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testResults-windows-powershell
          path: output/testResults.xml
          if-no-files-found: ignore

  pwsh:
    name: Lint + Test (PowerShell 7)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint + Test + Package
        shell: pwsh
        run: ./build.ps1 -Bootstrap -Task All

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testResults-pwsh
          path: output/testResults.xml
          if-no-files-found: ignore

      - name: Upload module package
        uses: actions/upload-artifact@v4
        with:
          name: PacKit-module
          path: output/*.zip
          if-no-files-found: error
